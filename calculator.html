<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Little Calculator</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <div class="calculator">
    <h1>The Little Calculator</h1>

    <input type="text" id="input" placeholder="Number or CSV list (e.g. 3,1.5,-2)" aria-label="Number or CSV list">
    <h2 id="info" class="big" title="Info about the number">Information about the number</h2>

    <h3>Unary operations</h3>
    <div class="group unary">
      <button id="square" title="Alt+S" onclick="square()">x²</button>
      <button id="cube" title="Alt+C" onclick="cube()">x³</button>
      <button id="sqrt" title="Alt+R" onclick="sqrt()">√x</button>
      <button id="modulo" title="Alt+M" onclick="mod()">|x|</button>
      <button id="factorial" title="Alt+F" onclick="fact()">x!</button>
    </div>

    <h3>Binary operations</h3>
    <div class="group binary">
      <button id="addition" title="Alt+A" onclick="addition()">+</button>
      <button id="subtraction" title="Alt+T" onclick="subtraction()">−</button>
      <button id="multiplication" title="Alt+X" onclick="multiplication()">×</button>
      <button id="equal" title="Enter" class="equal" onclick="eq()">=</button>
    </div>

    <h3>CSV operations</h3>
    <div class="group csv">
      <button id="sum" title="Alt+U" onclick="sum()">sum</button>
      <button id="average" title="Alt+V" onclick="average()">average</button>
      <button id="sort" title="Alt+O" onclick="sort()">sort</button>
      <button id="reverse" title="Alt+E" onclick="reverse()">reverse</button>
      <button id="removelast" title="Alt+L" onclick="removelast()">remove last</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
